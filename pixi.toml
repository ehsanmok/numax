[workspace]
authors = ["ehsanmok <ehsanmok@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "numax"
version = "0.1.0"
preview = ["pixi-build"]

# Below this, the aliased platform entries need a newer pixi; an older one
# rejects the whole file with `expected a string, found table`.
requires-pixi = ">=0.76"

# The `-mac14`/`-glibc235` aliases are for bench-python only: mlx and torch
# ship wheels for macOS 14+ / glibc 2.35+, above pixi's assumed baseline.
platforms = [
    "osx-arm64",
    { name = "osx-arm64-mac14", platform = "osx-arm64", macos = "14.0" },
    "linux-64",
    { name = "linux-64-glibc235", platform = "linux-64", glibc = "2.35" },
    "linux-aarch64",
    { name = "linux-aarch64-glibc235", platform = "linux-aarch64", glibc = "2.35" },
]

[package]
name = "numax"
version = "0.1.0"

[package.build]
# ">=0.4" is the floor that solves; 0.3.x has no candidates left.
backend = { name = "pixi-build-rattler-build", version = ">=0.4" }

[dependencies]
# `max-core`, not `max`: numax imports the Mojo kernel packages and nothing
# Python-facing, and dropping the Python API takes this env from 66 packages
# to 55. `mojo` is not redundant on top of it -- `max-core` pulls
# `mojo-compiler` (which has `bin/mojo`), but the metapackage is what brings
# `mblack` for `mojo format` and `llvm-symbolizer` for CI's crash dumps.
max-core = "==26.5"
mojo = ">=1.0.0,<2.0.0"
# For `examples/intermediate/npy_to_cholesky.mojo` only, which checks the
# `.npy` round trip against real NumPy. Nothing under `numax/` imports it.
numpy = ">=1.18"

# The cross-language baselines live in their own features so `pixi install`
# does not pull NumPy/MLX/PyTorch/Rust for the library itself.
[feature.bench-python]
platforms = ["osx-arm64-mac14", "linux-64-glibc235", "linux-aarch64-glibc235"]

[feature.bench-python.dependencies]
python = ">=3.11,<3.13"

[feature.bench-python.pypi-dependencies]
numpy = ">=2.0"
torch = ">=2.5"
# The LAPACK/BLAS baseline for bench/scipy/linalg.py.
scipy = ">=1.14"
# Only to regenerate bench/accuracy/reference_data.mojo, which is checked in.
mpmath = ">=1.3"

# macOS only. On Linux the backend is an opt-in extra pinning a CUDA major
# version, and a bare `mlx` there imports as "libmlx.so: cannot open shared
# object file".
[feature.bench-python.target.osx-arm64-mac14.pypi-dependencies]
mlx = ">=0.30"

# Declared on the same target as its dependency, so it does not show up in
# `pixi task list` on Linux.
[feature.bench-python.target.osx-arm64-mac14.tasks]
bench-mlx = { cmd = "python3 gaussian.py", cwd = "bench/mlx" }

# One wheel per CUDA major version; a CUDA 13 host wants `cupy-cuda13x`.
[feature.bench-python.target.linux-64-glibc235.pypi-dependencies]
cupy-cuda12x = ">=13"
# The math libraries CuPy's linalg path dlopens -- without them
# bench/cupy/linalg.py fails at import on a CUDA 13 host.
nvidia-cublas-cu12 = ">=12.4"
nvidia-cusolver-cu12 = ">=11.6"
nvidia-cusparse-cu12 = ">=12.3"
nvidia-nvjitlink-cu12 = ">=12.4"

[feature.bench-python.target.linux-64-glibc235.tasks]
bench-cupy = { cmd = "python3 gaussian.py", cwd = "bench/cupy" }
bench-cupy-linalg = { cmd = "python3 linalg.py", cwd = "bench/cupy" }

[feature.bench-python.tasks]
bench-numpy = { cmd = "python3 gaussian.py", cwd = "bench/numpy" }
bench-torch = { cmd = "python3 gaussian.py", cwd = "bench/torch" }
# `bench-torch-linalg` is not under the linux-64 target because PyTorch
# installs everywhere and its script exits when there is no device.
bench-scipy-linalg = { cmd = "python3 linalg.py", cwd = "bench/scipy" }
bench-torch-linalg = { cmd = "python3 linalg.py", cwd = "bench/torch" }
bench-scipy-signal = { cmd = "python3 signal_processing.py", cwd = "bench/scipy" }
# Not `fft.py`: a module in the task's `cwd` shadowing one SciPy imports
# breaks the directory.
bench-scipy-fft = { cmd = "python3 fft_transforms.py", cwd = "bench/scipy" }
bench-scipy-interpolate = { cmd = "python3 interpolate.py", cwd = "bench/scipy" }
bench-scipy-stats = { cmd = "python3 stats.py", cwd = "bench/scipy" }
bench-numpy-core-surface = { cmd = "python3 core_surface.py", cwd = "bench/numpy" }
accuracy-gen = { cmd = "python3 gen_reference.py", cwd = "bench/accuracy" }

[feature.bench-rust]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[feature.bench-rust.dependencies]
rust = ">=1.95"

[feature.bench-rust.tasks]
bench-thermite = { cmd = "cargo run --release", cwd = "bench/thermite" }

# Everything beyond running the library and its tests: `pixi run -e dev`.
[feature.dev.dependencies]
pre-commit = ">=4.2.0,<5"
# mojodoc is deliberately not a dependency: its own `[package.build]` pin
# (`==0.3.13`) cannot solve alongside numax's `>=0.4`. The docs tasks below
# shell out to a sibling `../mojodoc` checkout instead, overridable with
# MOJODOC_CLI.

[feature.dev.tasks]
install-pre-commit = "pre-commit install"
# In the dev feature because it depends-on `install-pre-commit`.
format = { cmd = "mojo format numax examples tests bench", depends-on = ["install-pre-commit"] }
format-check = { cmd = "bash -c 'mojo format numax examples tests bench && git diff --exit-code numax examples tests bench || (echo \"Error: Code is not formatted. Run \\\"pixi run -e dev format\\\" to fix.\" && exit 1)'" }
# `--open` previews; `docs-build` writes target/doc/ for docs.yaml.
docs      = { cmd = "bash -c 'CLI=${MOJODOC_CLI:-../mojodoc/packages/cli/dist/index.js}; node \"$CLI\" build ./numax --open'" }
docs-build = { cmd = "bash -c 'CLI=${MOJODOC_CLI:-../mojodoc/packages/cli/dist/index.js}; node \"$CLI\" build ./numax --out-dir target/doc --base-url /numax/'" }

[environments]
# `dev` inherits the default feature because mojodoc invokes mojo; the bench
# envs do not, having nothing to do with it.
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
bench-python = { features = ["bench-python"], no-default-feature = true }
bench-rust = { features = ["bench-rust"], no-default-feature = true }

[tasks]
# Every task below spells out `-I .`; a bare `pixi run mojo <file>` cannot
# find `numax`.
run = { cmd = "mojo -I . {{ file }}", args = ["file"] }

# Most are *expected* to fail -- the diagnostic is the result. No `-I .`, so
# they stay sendable upstream. `1.8` never terminates by design.
repro = { cmd = "mojo .cursor/upstream-repros/{{ file }}", args = ["file"] }

test-dual = "mojo -I . tests/core/test_dual.mojo"
