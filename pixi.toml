    "example-ode",
    "example-random-ensemble",
    "example-unified-tensor-gpu",
    "example-gaussian-gpu",
    "example-quantum-well",
    "example-batched-solve",
] }
# The seven GPU examples, compiled but not run, to catch a signature drift.
# `--target-accelerator` is not optional: without it host detection fails on a
# GPU-less machine with `Unknown GPU architecture detected`. `sm_80` on every
# host including Apple Silicon, because NVPTX codegen is in-tree while
# `metal:N` shells out to Apple's compiler.
examples-gpu-build = "bash tools/run_examples.sh --gpu-build"
# The CPU examples, built concurrently then run one process each.
# tools/run_examples.sh discovers them from `git ls-files` minus the GPU
# list, so a new example is covered without being added anywhere.
examples-cpu = "bash tools/run_examples.sh"

# For bisecting to one example; see `tests-per-file`.
examples-cpu-per-file = { depends-on = [
    "example-gaussian",
    "example-array-creation",
    "example-npy-interop",
