# One binary per area of tests/ rather than one `mojo` per file:
# compilation was the entire cost (CI 22.9 min to ~35s warm locally), and it
# cuts process starts from 89 to 11, which matters for the transient
# `libKGENCompilerRTShared` segfault. The aggregates are generated by
# tools/gen_test_aggregates.py and re-checked against the tree before
# building, so a new test file cannot silently stop running.
tests = "bash tools/run_test_aggregates.sh"
tests-gen = "python3 tools/gen_test_aggregates.py"

