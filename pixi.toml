] }
bench = "mojo -I . bench/bench_tensor_map.mojo"
bench-matmul = "mojo -I . bench/bench_matmul.mojo"
bench-elementwise = "mojo -I . bench/bench_elementwise.mojo"
bench-linalg = "mojo -I . bench/bench_linalg.mojo"
bench-signal = "mojo -I . bench/bench_signal.mojo"
bench-fft = "mojo -I . bench/bench_fft.mojo"
bench-interpolate = "mojo -I . bench/bench_interpolate.mojo"
bench-stats = "mojo -I . bench/bench_stats.mojo"
# CPU-only; `bench-core-surface-gpu` is the same rows on a device.
bench-core-surface = "mojo -I . bench/bench_core_surface.mojo"
# Needs a real device, and `float32` only: naming `gpu=True` compiles the
# device kernels whether or not they run.
bench-core-surface-gpu = "mojo -I . bench/bench_core_surface_gpu.mojo"
# The fusion sweep runs a GPU half, so it needs real Metal hardware too.
bench-fusion = "mojo -I . bench/bench_fusion.mojo"
# Needs real Metal hardware, like the GPU examples -- a local-only check.
bench-gpu = "mojo -I . bench/bench_tensor_map_gpu.mojo"
# The linalg sweep on a device. `float32` only, and not because of a choice
# numax made: `linalg.matmul` does not compile for GPU at `float64`, since
# its GEMV path reduces through `warp.shuffle`. Needs a real device.
bench-linalg-gpu = "mojo -I . bench/bench_linalg_gpu.mojo"
# The BLAS-1 half of the same sweep, a separate file because the two halves
# together instantiate more GPU kernels than Apple's Metal compiler will put
# in one metallib. Needs a real device, like its sibling.
bench-blas1-gpu = "mojo -I . bench/bench_blas1_gpu.mojo"
# Diagnoses *why* the GPU path lands where it does: bandwidth vs arithmetic,
# per-thread width, block size, and sync accounting. Metal hardware too.
bench-roofline = "mojo -I . bench/bench_gpu_roofline.mojo"
# Max error per function per domain against checked-in mpmath references.
# CPU-only and hermetic, so CI can run it; regenerate the references with
# `pixi run -e bench-python accuracy-gen` after changing a domain.
accuracy = "mojo -I . -I bench/accuracy bench/accuracy/accuracy.mojo"
