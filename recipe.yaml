# rattler-build recipe for numax
# Distributes numax as its *source* tree under $PREFIX/lib/mojo/ rather than
# a pre-compiled .mojopkg artifact -- same shape as ehsanmok/json and
# ehsanmok/sqlite. Consumers' Mojo resolves ``from numax import ...``
# directly from these source files at their own compile time.
#
# Why source-level distribution rather than ``mojo package``: a ``.mojopkg``
# embeds the exact compiler version it was built with and refuses to load
# against any other version (``Mojo package is incompatible``), which
# tightly couples the published .conda artifact to one Mojo release. Source
# distribution has no ABI-locked binary content at all -- the ``run: mojo
# == ...`` pin below is what tells solvers which compiler to install, and
# it's a one-line bump here rather than a rebuild.
#
# numax has no FFI shim and no C++ build step (unlike json's simdjson
# wrapper), so this recipe is just a copy -- no ${{ compiler(...) }}
# requirement, no host/build split.

context:
  name: numax
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: .

build:
  script:
    - mkdir -p $PREFIX/lib/mojo
    - cp -r numax $PREFIX/lib/mojo/

requirements:
  run:
    - mojo ==1.0.0
    - max ==26.5

about:
  homepage: https://github.com/ehsanmok/numax
  license: Apache-2.0 WITH LLVM-exception
  summary: Numerical computing for Mojo on MAX -- what NumPy and SciPy provide, on MAX's tensors, each kernel written once and running on any device MAX drives.
  description: |
    numax is a numerical computing library for Mojo built on MAX -- what
    NumPy and SciPy provide, on MAX's tensors: special functions, dense
    linear algebra with its spectral decompositions (eigh, svd, schur and
    the matrix functions on the Schur form), optimization (minimize with
    l-bfgs and bounds, root, nnls), quadrature and ODE solvers,
    interpolation, FFTs at any length, signal processing, the nine
    scipy.stats distributions over tensors, the NumPy statistics surface
    from quantile and histogram through the hypothesis tests, and a
    NumPy-named array surface with .npy interchange. The SciPy entry points
    are spelled the way SciPy spells them, method strings included. Every
    Tensor entry point runs on the host or on any device MAX drives through
    one gpu parameter, and the device-resident work -- factorizations,
    reductions, transforms, sampling -- never rounds through the host.

    Every kernel is written once against a trait (FloatLike), so the type
    you call it with decides what comes back: a value (Plain), a derivative
    (Dual), a full gradient (Gradient), extra precision (Compensated),
    exact base-10 fixed point (Decimal), a complex result (Complex), or an
    interval bound (Interval). They nest, so a Hessian or a holomorphic
    derivative needs no separate implementation. Tensors own MAX
    DeviceBuffers and carry their shape in their layout type, with extents
    either compiled in or supplied at run time, so numax.core.tensor drives
    any of it across MAX's TileTensor on CPU or GPU.
