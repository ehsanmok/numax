name: CI

# Prose-only changes cannot break the build, so they do not spend a matrix of
# macOS and Linux runners. Mojo docstrings live in .mojo files and are still
# covered: the ignored globs are markdown, images and agent-local material.
#
# `.cursor/**` is ignored for a stronger reason than cost. Most of it is
# untracked, but `.cursor/upstream-repros/` ships, and the `.mojo` files in it
# are upstream bug reports that are *expected* to fail to compile. Letting
# them reach a build step would turn evidence into a red build.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.svg'
      - 'docs/**'
      - '.cursor/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.svg'
      - 'docs/**'
      - '.cursor/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # pixi.toml supports osx-arm64, linux-64 and linux-aarch64; these are the
    # two GitHub hosts a public runner covers (the macOS image is Apple
    # Silicon).
    # The library was developed on macOS, so Linux is the platform most likely
    # to drift without a job here -- the CPU library, the examples and the
    # accuracy harness are all platform-independent code that had never been
    # exercised off Apple Silicon before this job existed.
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the other's run: which
      # platforms broke is the whole question a matrix is here to answer.
      fail-fast: false
      matrix:
        # macOS is pinned to `macos-15` rather than tracking `macos-14`:
        # the older image hits a Mojo-runtime segfault inside
        # `libKGENCompilerRTShared.dylib` that the sibling flare repo
        # documents, and macos-15 matches the SDK this library is
        # developed against.
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          # Only solve + install the lean runtime env: `dev` (pre-commit),
          # `bench-python` (NumPy/MLX/PyTorch) and `bench-rust` (a Rust
          # toolchain) are contributor-only tooling this job never touches.
          # `pixi-version` is intentionally unpinned -- unlike the sibling
          # flare repo, numax's manifest declares `requires-pixi = ">=0.76"`,
          # so the old pixi that repo pins for its 0.3.13 build backend
          # cannot even parse this one.
          environments: default
          # Install straight from the committed pixi.lock; never re-solve
          # conda-forge in CI (the network solve is flaky). Fails loudly
          # if the lock has drifted from pixi.toml.
          locked: true
          cache: false
          post-cleanup: false

      - name: Run unit tests
        # `pixi run tests` is tools/run_test_aggregates.sh: it compiles each
        # area of tests/ into one binary, builds those in parallel, and runs
        # them. This step used to inline an 89-suite build-and-run loop with
        # its own retry, and the aggregate runner now owns all of it.
        #
        # Why aggregate: the per-file chain re-elaborated the `numax` source
        # graph once per file, and this step was the whole job -- 22.9 min on
        # macos-15 and 27.4 min on ubuntu-latest at run 35066346719, the last
        # green one before the change. The 1437 tests themselves run in under
        # a second; compilation was all of it.
        #
        # This runner starts cold every time, since the environment is
        # installed fresh and the Mojo compilation cache comes with it.
        # Caching `$MODULAR_HOME/cache` between runs is the remaining lever
        # and is deliberately not done yet: the size one clean run writes
        # there has to be measured before a cache key is worth adding.
        #
        # The retry still exists and is still per *area*, not per run: the
        # Mojo runtime segfaults transiently inside
        # `libKGENCompilerRTShared` on a fresh process before any user code
        # runs, so retrying the whole set would re-roll every start to
        # recover from one flake. Aggregation cuts the exposure from 89
        # process starts to 11, and a genuinely broken area still fails
        # three times and fails the job. The runner also keeps the
        # `-debug-level=line-tables` build, so a crash names the function it
        # died in rather than eight raw addresses.
        #
        # The disk report is diagnostic: a runner that fills up mid-run
        # would look exactly like a flaky crash.
        run: |
          # The Mojo runtime symbolicates a crash dump only if it can find
          # llvm-symbolizer; the runner has none on PATH but the pinned
          # toolchain ships one.
          export LLVM_SYMBOLIZER_PATH="$PWD/.pixi/envs/default/bin/llvm-symbolizer"
          pixi run tests
          rc=$?
          echo "── disk after the run ──"
          df -h . | tail -1
          exit $rc

      - name: Run CPU examples
        run: pixi run examples-cpu

      # The GPU examples cannot run here, but `mojo build` against a named
      # `--target-accelerator` type-checks their bodies with no device present
      # -- which is what would have caught the `linspace(ctx, ...)` calls that
      # sat broken because nothing in CI compiled these files at all. The
      # architecture is pinned in the pixi task; see the comment there for why
      # host detection is not an option on a GPU-less runner.
      - name: Compile GPU examples
        run: pixi run examples-gpu-build

      - name: Run CPU benchmark
        run: pixi run bench

      # *Running* the GPU examples and the GPU benchmarks needs a real device
      # -- Metal or CUDA, whichever `DeviceContext` finds. No GitHub-hosted
      # runner has either, so execution stays a local/manual check; the step
      # above compiles them here so at least their call sites stay honest. They are verified by
      # hand on both backends; see docs/performance.md.
