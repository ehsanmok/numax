name: CI

# Prose-only changes cannot break the build, so they do not spend a matrix of
# macOS and Linux runners. Mojo docstrings live in .mojo files and are still
# covered: `**.md` and `docs/` are markdown and images only.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  test:
    # pixi.toml supports osx-arm64, linux-64 and linux-aarch64; these are the
    # two GitHub hosts a public runner covers (macos-14 is Apple Silicon).
    # The library was developed on macOS, so Linux is the platform most likely
    # to drift without a job here -- the CPU library, the examples and the
    # accuracy harness are all platform-independent code that had never been
    # exercised off Apple Silicon before this job existed.
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the other's run: which
      # platforms broke is the whole question a matrix is here to answer.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Run unit tests
        run: pixi run tests

      - name: Run CPU examples
        run: pixi run examples-cpu

      - name: Run CPU benchmark
        run: pixi run bench

      # The GPU examples (gaussian_gpu, softmax, ode, random_ensemble) and the
      # GPU benchmarks need a real device -- Metal or CUDA, whichever
      # `DeviceContext` finds. No GitHub-hosted runner has either, so they stay
      # local/manual-only checks rather than CI steps. They are verified by
      # hand on both backends; see docs/performance.md.
